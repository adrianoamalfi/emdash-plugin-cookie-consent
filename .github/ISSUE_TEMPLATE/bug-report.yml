name: Bug Report
description: Report a bug or unexpected behavior
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Install the plugin with '...'
        2. Configure '...'
        3. Navigate to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin Version
      description: What version of the plugin are you using?
      placeholder: e.g., 0.1.0
    validations:
      required: true

  - type: input
    id: emdash-version
    attributes:
      label: EmDash Version
      description: What version of EmDash are you running?
      placeholder: e.g., ^0.12.0
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant Configuration
      description: Your astro.config.mjs or plugin setup (if relevant)
      render: typescript
      placeholder: |
        import { cookieConsentPlugin } from "emdash-plugin-cookie-consent";
        emdash({ plugins: [cookieConsentPlugin()] })

  - type: textarea
    id: logs
    attributes:
      label: Logs / Console Output
      description: Any relevant error messages or console output
      render: shell
